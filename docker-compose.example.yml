# Bu dosya production'da kullanılmaz - sadece örnek/dokümantasyon amaçlı.
# Abacasa'tan yeni proje oluşturduğunuzda bu blokları
# /opt/services/docker-compose.yml'e ekleyin.
# PROJECT_NAME ve port numaralarını güncelleyin.

version: '3.8'

services:
  # Production servis bloğu
  abacasa-api-prod:
    image: ghcr.io/GITHUB_USER/abacasa-api:latest
    container_name: abacasa-api-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=abacasa_prod;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      JwtSettings__SecretKey: ${JWT_SECRET_ABACASA_PROD}
      JwtSettings__Issuer: "JWTAbacasa"
      JwtSettings__Audience: "JWTAbacasaClients"
      NotificationService__Mail__Host: ${SMTP_HOST_ABACASA}
      NotificationService__Mail__Username: ${SMTP_USER_ABACASA}
      NotificationService__Mail__Password: ${SMTP_PASS_ABACASA}
      NotificationService__Mail__FromAddress: ${SMTP_FROM_ABACASA}
      # Seed admin user passwords (only used on first deploy when DB is empty)
      # Set these in /opt/services/.env, then unset after first successful deploy
      INITIAL_SUPERADMIN_PASSWORD: ${INITIAL_SUPERADMIN_PASSWORD_ABACASA_PROD}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD_ABACASA_PROD}
      # Dosya depolama: varsayılan Local (aşağıdaki volume). S3 uyumlu servise geçmek için:
      # Storage__Provider: S3
      # Storage__S3__ServiceUrl: ${S3_URL_ABACASA}          # ör. https://<hesap>.r2.cloudflarestorage.com
      # Storage__S3__Bucket: abacasa-prod
      # Storage__S3__AccessKey: ${S3_KEY_ABACASA}
      # Storage__S3__SecretKey: ${S3_SECRET_ABACASA}
      # Storage__S3__PublicBaseUrl: https://files.example.com  # frontend build'inde FILES_PUBLIC_URL de bu olmalı
    volumes:
      # Yüklenen dosyalar (Storage:Provider=Local). Volume olmazsa her deploy'da silinir; yedeğe ekleyin.
      - abacasa-uploads-prod:/app/storage/uploads
    networks: [app-network]
    ports:
      - '127.0.0.1:5003:8080'  # 5003: değiştir (kullanılan port'lara göre)

  # Test/Staging servis bloğu
  abacasa-api-test:
    image: ghcr.io/GITHUB_USER/abacasa-api:dev
    container_name: abacasa-api-test
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=abacasa_test;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      JwtSettings__SecretKey: ${JWT_SECRET_ABACASA_TEST}
      JwtSettings__Issuer: "JWTAbacasa"
      JwtSettings__Audience: "JWTAbacasaClients"
      NotificationService__Mail__Host: ${SMTP_HOST_ABACASA}
      NotificationService__Mail__Username: ${SMTP_USER_ABACASA}
      NotificationService__Mail__Password: ${SMTP_PASS_ABACASA}
      NotificationService__Mail__FromAddress: ${SMTP_FROM_ABACASA}
      # Seed admin user passwords (only used on first deploy when DB is empty)
      # Set these in /opt/services/.env, then unset after first successful deploy
      INITIAL_SUPERADMIN_PASSWORD: ${INITIAL_SUPERADMIN_PASSWORD_ABACASA_TEST}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD_ABACASA_TEST}
    volumes:
      - abacasa-uploads-test:/app/storage/uploads
    networks: [app-network]
    ports:
      - '127.0.0.1:5004:8080'  # 5004: değiştir (kullanılan port'lara göre)

volumes:
  abacasa-uploads-prod:
  abacasa-uploads-test:

networks:
  app-network:
    external: true
